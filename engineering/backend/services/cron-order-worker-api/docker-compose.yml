services:
  mysql:
    image: mysql:8.4
    container_name: cron_order_worker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cron_demo
      MYSQL_USER: cron_user
      MYSQL_PASSWORD: cron_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cron_user", "-pcron_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
